services:
  db:
    image: postgres:16
    container_name: app_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: app_api
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://app:apppass@db:5432/appdb
      # Provide a strong secret via your shell/host env, e.g. `export JWT_SECRET=$(openssl rand -base64 48)`.
      # The API refuses to boot on a weak/default secret (see assertJwtSecretStrong).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a random 32+ char value}
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    # `prisma migrate dev` prompts interactively (new migration name / drift
    # resets) and hangs forever with no TTY attached here — that's what was
    # causing the api container to sit stuck instead of ever reaching
    # `npm run dev`. `migrate deploy` only applies existing migrations and
    # never prompts. Use `npm run prisma:migrate` (dev) locally when you're
    # actually authoring a new migration.
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run prisma:seed && npm run dev"

volumes:
  db_data:
